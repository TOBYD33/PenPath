services:
  - type: web
    name: penpath-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install && pnpm --filter @penpath/shared build && pnpm --filter @penpath/api build && pnpm --filter @penpath/api exec prisma migrate deploy
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
